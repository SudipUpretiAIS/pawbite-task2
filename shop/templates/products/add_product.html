{% extends 'base.html' %}{% block title %}Add Product | PawBite{% endblock %}{% block body %}{% include 'admin/navbar.html' %}<main class='admin-page'><div class='container'><div class='form-shell wide'>{% include 'flash_message.html' %}<a class='back-link' href='{{ url_for("admin_home") }}'>← Back to products</a><h1>Add product</h1><p>Create a dog food product for the store.</p><form action='{{ url_for("addproduct") }}' method='post' enctype='multipart/form-data'><div class="row g-3"><div class="col-md-8"><label>Product name</label><input class="form-control" name="name" value="{{ product_to_update.name if product_to_update else '' }}" required></div><div class="col-md-4"><label>Price</label><input type="number" step="0.01" min="0" class="form-control" name="price" value="{{ product_to_update.price if product_to_update else '' }}" required></div><div class="col-md-6"><label>Category</label><select class="form-select" name="category" required><option value="">Choose category</option>{% for category in categories %}<option value="{{ category.id }}" {% if product_to_update and category.id == product_to_update.category_id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Search tags</label><input class="form-control" name="tag" value="{{ product_to_update.tag if product_to_update else '' }}" placeholder="puppy, chicken, dry" required></div><div class="col-12"><label>Description</label><textarea class="form-control" rows="5" name="desc" required>{{ product_to_update.description if product_to_update else '' }}</textarea></div><div class="col-12"><label>Product image {% if product_to_update %}(leave empty to keep current image){% endif %}</label><input type="file" class="form-control" name="pic" accept="image/*" {% if not product_to_update %}required{% endif %}></div></div><button class='btn btn-accent w-100 mt-4'>Add Product</button></form></div></div></main>{% endblock %}
